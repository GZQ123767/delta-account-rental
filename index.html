<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101410">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="三角洲商行暂停服务公告">
  <title>三角洲商行｜暂停服务</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #101410;
      color: #f4f6f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(145, 255, 50, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(145, 255, 50, .035) 1px, transparent 1px),
        #101410;
      background-size: 36px 36px;
    }

    main {
      width: min(680px, calc(100% - 40px));
      padding: 56px 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 28px;
      color: #a8ff5a;
      font-size: 13px;
      font-weight: 700;
    }

    .status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #a8ff5a;
      box-shadow: 0 0 18px rgba(168, 255, 90, .65);
    }

    h1 {
      margin: 0;
      max-width: 600px;
      font-size: clamp(42px, 9vw, 76px);
      line-height: 1.03;
      letter-spacing: 0;
    }

    .lead {
      margin: 25px 0 38px;
      max-width: 540px;
      color: #afb6aa;
      font-size: 17px;
      line-height: 1.8;
    }

    .contact {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 22px 0;
      border-top: 1px solid #30372e;
      border-bottom: 1px solid #30372e;
    }

    .contact span,
    footer { color: #858d81; font-size: 13px; }
    .contact strong { display: block; margin-top: 7px; font-size: 20px; }

    button {
      width: 44px;
      height: 44px;
      border: 1px solid #4f594b;
      border-radius: 6px;
      background: transparent;
      color: #f4f6f1;
      cursor: pointer;
      font-size: 20px;
    }

    button:hover { border-color: #a8ff5a; color: #a8ff5a; }
    footer { margin-top: 34px; }

    @media (max-width: 520px) {
      main { width: min(100% - 28px, 680px); padding: 40px 0; }
      .lead { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="status">服务状态：已暂停</div>
    <h1>三角洲商行<br>暂停营业</h1>
    <p class="lead">网站目前不接受新订单，也不提供账号上架及付款服务。历史数据已保留，恢复时间另行通知。</p>
    <section class="contact" aria-label="官方联系方式">
      <div><span>官方联系方式</span><strong>微信 G644373420</strong></div>
      <button type="button" id="copyContact" title="复制微信号" aria-label="复制微信号">⧉</button>
    </section>
    <footer>三角洲商行 · 暂停服务公告</footer>
  </main>
  <script>
    document.getElementById('copyContact').addEventListener('click', async (event) => {
      await navigator.clipboard.writeText('G644373420');
      event.currentTarget.textContent = '✓';
      event.currentTarget.title = '已复制';
    });
  </script>
</body>
</html>
